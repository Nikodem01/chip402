<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chip402</title>
<style>
  :root {
    --bg: #101315;
    --panel: #101315;
    --fg: #cacccc;
    --dim: #7a7f82;
    --muted: #4b4e55;
    --accent: #a8adb0;
    --border: rgba(202,204,204,0.18);
    --fill: rgba(202,204,204,0.08);
    --green: #9fa5a9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #080a0b; }
  body {
    font-family: "Cera Pro", "IBM Plex Sans", "Noto Sans", sans-serif;
    color: var(--fg);
    min-height: 100vh;
  }
  .desktop {
    width: 960px;
    height: 600px;
    margin: 0 auto;
    background:
      radial-gradient(1200px 500px at 20% -10%, #1a1e22 0%, transparent 50%),
      #080a0b;
    position: relative;
    overflow: hidden;
  }
  .bar {
    position: absolute;
    top: 10px; left: 16px; right: 16px;
    height: 36px;
    border-radius: 12px;
    background: rgba(16,19,21,0.92);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    font-size: 13px;
  }
  .bar .left, .bar .right { display: flex; gap: 14px; align-items: center; }
  .icon {
    width: 18px; height: 18px;
    display: grid; place-items: center;
    color: var(--fg);
  }
  .chip { width: 16px; height: 16px; display: block; }
  .panel {
    position: absolute;
    top: 56px; right: 28px;
    width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 18px 16px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45);
  }
  .hero { display: flex; align-items: center; gap: 14px; }
  .hero-icon { width: 42px; height: 42px; display: grid; place-items: center; color: var(--fg); }
  .hero-icon .chip { width: 36px; height: 36px; }
  .hero h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  .hero .meta { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .hero-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .pill {
    font-size: 12px; color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 3px 8px;
  }
  .switch {
    width: 42px; height: 22px; border-radius: 99px;
    background: var(--accent); position: relative;
  }
  .switch b {
    position: absolute; width: 16px; height: 16px; border-radius: 99px;
    background: var(--bg); top: 3px; right: 3px;
  }
  .stats { margin-top: 16px; font-size: 13px; }
  .row { display: flex; justify-content: space-between; padding: 3px 0; }
  .row span { color: var(--dim); }
  .meter { height: 4px; border-radius: 99px; background: rgba(202,204,204,0.18); margin: 4px 0 8px; }
  .meter b { display: block; height: 100%; width: 25%; border-radius: 99px; background: var(--fg); }
  .section {
    margin-top: 16px; padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .label {
    font-size: 11px; letter-spacing: 0.14em; color: var(--dim); margin-bottom: 10px;
  }
  .entry {
    display: flex; gap: 10px; align-items: center;
    padding: 8px 8px; border-radius: 10px;
  }
  .entry:first-of-type { background: var(--fill); }
  .check { width: 18px; text-align: center; }
  .entry .t { font-size: 14px; }
  .entry .s { font-size: 12px; color: var(--dim); margin-top: 1px; }
  .title { flex: 1; }
</style>
</head>
<body>
  <div class="desktop">
    <div class="bar">
      <div class="left"><span>1</span><span>2</span><span>3</span></div>
      <div class="right">
        <div class="icon" title="chip402">
          <img class="chip" src="chip.svg" alt="">
        </div>
        <span>Sun 23</span>
        <span>20:22</span>
      </div>
    </div>
    <div class="panel">
      <div class="hero">
        <div class="hero-icon">
          <img class="chip" src="chip.svg" alt="">
        </div>
        <div>
          <h1>chip402</h1>
          <div class="meta">Metering agents</div>
        </div>
        <div class="hero-right">
          <div class="pill">7.50 left</div>
          <div class="switch"><b></b></div>
        </div>
      </div>
      <div class="stats">
        <div class="row"><span>Balance</span>10.00 USDC</div>
        <div class="row"><span>Today</span>2.50 / 10.00 USDC</div>
        <div class="meter"><b></b></div>
        <div class="row"><span>Per request</span>1.00 USDC</div>
        <div class="row"><span>Account</span>0.0.4522101</div>
      </div>
      <div class="section">
        <div class="label">LEDGER</div>
        <div class="entry">
          <div class="check">✓</div>
          <div class="title">
            <div class="t">127.0.0.1</div>
            <div class="s">20:22:04 · 0.01 USDC · paid</div>
          </div>
        </div>
        <div class="entry">
          <div class="check">✓</div>
          <div class="title">
            <div class="t">127.0.0.1</div>
            <div class="s">20:21:51 · 0.01 USDC · paid</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
